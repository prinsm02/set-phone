<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Set Phone">
<meta name="theme-color" content="#f6f6f6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="laptop.css">
<title>Set Phone</title>
</head>
<body>

<!-- DIRECTOR MODE (setup; never on camera) -->
<div id="director">
  <header class="d-head">
    <h1>Set Phone</h1>
    <span class="d-sub">phone prop for set</span>
  </header>
  <main id="d-main"></main>
</div>

<!-- PLAY MODE (on camera) -->
<div id="stage" hidden>
  <div id="fakeStatus" hidden>
    <span class="fs-time" id="fsTime">9:41</span>
    <span class="fs-right">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.4-2.9a3.6 3.6 0 0 0-4.8 0zM3.4 6.3a7 7 0 0 1 9.2 0l1.5-1.8a9.4 9.4 0 0 0-12.2 0zM.2 2.6a12 12 0 0 1 15.6 0L16 2.3 15.8 2A12.4 12.4 0 0 0 .2 2z"/></svg>
      <span class="fs-batt"><span></span></span>
    </span>
  </div>
  <div id="screen"></div>
  <div id="banner" class="banner" hidden></div>
  <div id="fakeHome" hidden></div>
  <div id="notch" hidden></div>
  <!-- hidden controls -->
  <div id="cueZone" title="hidden: next cue"></div>
  <div id="exitZone" title="hidden: hold 2 s to exit"></div>
  <div id="cueFlash"></div>
</div>

<input type="file" id="filePick" hidden>
<script src="presets.js"></script>
<script src="app.js"></script>
<script src="laptop.js"></script>
</body>
</html>
